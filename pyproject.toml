[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quarrydb"
version = "0.1.0"
description = "An embedded SQL database written from scratch in pure Python: pager, WAL, B+trees, planner, SQL, shell. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["database", "sql", "embedded", "btree", "write-ahead-log", "from-scratch", "pure-python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Education",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Ethos6/quarrydb"
Source = "https://github.com/Ethos6/quarrydb"
Issues = "https://github.com/Ethos6/quarrydb/issues"

[project.scripts]
quarrydb = "quarrydb.cli:main"

[tool.setuptools.packages.find]
include = ["quarrydb", "quarrydb.*"]
